<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card UI Design</title>
    <!-- CSS -->
    <link rel="stylesheet" href="Outros/style.css" />
    <!-- Boxicons CSS -->
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="profile-card">
      <div class="image">
        <img src="Outros/rosto 2.jpg" alt="" class="profile-img" />
      </div>
      <div class="text-data">
        <span class="name">Estudante</span>
        <span class="job">Análise e Desenvolvimento de Sistemas</span>
      </div>
      <div class="media-buttons">
        <a href="https://github.com/RaioWhitex" target="_blank" style="background: #252525" class="link">
          <i class="bx bxl-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/gustavo-steferson-1896263a8?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" style="background: #1da1f2" class="link">
          <i class="bx bxl-linkedin"></i>
        </a>
        <a href="https://www.instagram.com/steferson_ofc?igsh=cnIxeXVreG1xOTNq" target="_blank" 
        style="background: #e1306c" class="link">
        <i class="bx bxl-instagram"></i>
      </a>
        </a>
        <a href="https://wa.me/5511933914350" target="_blank" style="background: #08f527f3" class="link">
          <i class="bx bxl-whatsapp"></i>
        </a>
      </div>
      <div class="buttons">
        <button class="button">Curtir</button>
        <button class="button">Seguir</button>
      </div>
      <div class="analytics">
        <div class="data">
          <i class="bx bx-heart"></i>
          <span class="number">100K</span>
        </div>
        <div class="data">
          <i class="bx bx-message-rounded"></i>
          <span class="number">20K</span>
        </div>
        <div class="data">
          <i class="bx bx-share"></i>
          <span class="number">12K</span>
        </div>
      </div>
    </div>
  </body>
</html>
